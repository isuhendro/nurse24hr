[project]
name = "nurse24hr"
version = "0.1.0"
description = "Camera-based feeding-tube pull-out monitor. Step 1: state machine, simulator, tests."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nurse24hr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
